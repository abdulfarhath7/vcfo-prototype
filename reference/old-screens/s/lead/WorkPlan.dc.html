<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lead · Plan my week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.L{font-family:Public Sans,system-ui,sans-serif;color:#15263b;font-size:13px;background:#f7f9fc;font-variant-numeric:tabular-nums}
.L *{box-sizing:border-box}
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
/* aligned columns: chips and row buttons share one width so they line up */
td .chip,.row>.chip,.td>.chip,.sr .chip,.ql .chip{min-width:84px;justify-content:center;box-sizing:border-box}
.row>.btn,td .btn,.td>.btn{min-width:84px;justify-content:center;box-sizing:border-box}
.mono{font-family:'IBM Plex Mono',monospace}
.sg{font-family:sans-serif;letter-spacing:-.03em}
.mut{color:#667180}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;font:600 13px Public Sans,sans-serif;border:1px solid #d0d5dd;background:#fff;color:#15263b;cursor:pointer}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:#f1f4f8;box-shadow:inset 0 0 0 1px #e3e6eb}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#98a1ae}
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh; position: relative">
  <div style="flex: 1 1 248px; max-width: 248px; background: #15263b"><dc-import name="Side" active="work" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; position: relative">
    <dc-import name="Top" crumb="Work" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <div style="flex: 1; position: relative; min-height: 900px; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 28px; display: grid; grid-template-columns: 320px 1fr; gap: 16px; opacity: .5">
        <div style="background: #fff; border: 1px solid #e3e6eb; border-radius: 10px"></div>
        <div style="background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; background-image: repeating-linear-gradient(90deg, transparent 0 calc(100% / 7 - 1px), #e3e6eb calc(100% / 7 - 1px) calc(100% / 7))"></div>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,42,74,.35)"></div>
      <aside role="dialog" aria-label="Plan my week" style="position: absolute; top: 0; right: 0; bottom: 0; width: min(980px, 100%); background: #fff; box-shadow: -20px 0 40px -20px rgba(15,42,74,.45); display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid #e3e6eb">
          <span style="width: 32px; height: 32px; border-radius: 8px; background: #fcefd8; color: #a35f00; display: grid; place-items: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path></svg></span>
          <div style="flex: 1"><b class="sg" style="font-size: 18px">Planning my week</b><div class="mut mono" style="font-size: 11px">19 to 23 OCT · 9 TO-DOS · 14.5 H</div></div>
          <span class="chip" style="background: #fcefd8; color: #a35f00">NEW</span>
          <button type="button" aria-label="Close" style="width: 32px; height: 32px; border: 0; background: none; color: #667180; font-size: 18px">✕</button>
        </div>
        <div style="flex: 1; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <span class="seg"><sc-for list="{{vw}}" as="v" hint-placeholder-count="2"><button type="button" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="{{v.st}}">{{v.l}}</button></sc-for></span>
            <span class="mono mut" style="font-size: 11px; letter-spacing: .04em">{{range}}</span>
            <span style="margin-left: auto; display: flex; gap: 6px">
              <button type="button" class="btn" aria-label="Previous week" style="width: 36px; padding: 0">‹</button>
              <button type="button" class="btn" aria-label="Next week" style="width: 36px; padding: 0">›</button>
              <button type="button" class="btn">+ Block time</button>
            </span>
          </div>
          <div style="border: 1px solid #e3e6eb; border-radius: 10px; overflow-x: auto; background: #fff">
            <div style="{{gridMin}}">
              <div style="{{cols}}">
                <span style="border-bottom: 1px solid #e3e6eb"></span>
                <sc-for list="{{days}}" as="d" hint-placeholder-count="5"><span style="{{d.hs}}">{{d.l}}<span style="{{d.ls}}">{{d.load}}</span></span></sc-for>
              </div>
              <div style="{{cols}}">
                <div style="{{hourCol}}"><sc-for list="{{hours}}" as="h" hint-placeholder-count="9"><span style="{{h.st}}">{{h.l}}</span></sc-for></div>
                <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
                  <div style="{{d.body}}">
                    <sc-for list="{{hours}}" as="h" hint-placeholder-count="9"><span style="{{h.line}}"></span></sc-for>
                    <sc-for list="{{d.ev}}" as="e" hint-placeholder-count="2">
                      <div style="{{e.st}}" title="{{e.tip}}"><b style="display: block; font-size: 13px; font-weight: 600; line-height: 1.25">{{e.t}}</b><span style="display: block; font-size: 12.5px; margin-top: 1px">{{e.range}}</span><span style="{{e.cs}}">{{e.c}}</span><sc-if value="{{e.warn}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; margin-top: 4px; background: #fff4e5; color: #8a4a10; border-radius:6px; padding: 1px 5px; font-size: 10px; font-weight: 700">{{e.warnT}}</span></sc-if></div>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
          <div style="display: flex; gap: 18px; flex-wrap: wrap">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 12.5px"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #15263b">Keep 9-11 AM for deep work</label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 12.5px"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #15263b">Overdue and filing-related first</label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 12.5px"><input type="checkbox" style="width: 16px; height: 16px; accent-color: #15263b">Group work by client</label>
          </div>
          <div style="display: flex; gap: 10px; align-items: flex-start; background: #f1f6ff; border: 1px solid #d6e4fb; border-radius: 8px; padding: 10px 12px">
            <img src="vcfo-bin:s/home/assets/vcfo-bot-avatar.svg" alt="" style="object-fit: contain; width: 36px; height: 36px">
            <div style="font-size: 12px"><b>Tuesday was over 6 h.</b><div class="mut">I moved the GST recon to Thursday. Its due date is still met.</div></div>
          </div>
        </div>
        <div style="display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid #e3e6eb; background: #eef0f3">
          <button type="button" class="btn">Cancel</button><span style="flex: 1"></span><button type="button" class="btn">Reshuffle</button><button type="button" class="btn" style="background: #15263b; color: #fff; border-color: #15263b">Add {{nOn}} blocks to calendar</button>
        </div>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const __m = (this.state && this.state.mode) || 'mixed';
    const __set = (m) => this.setState({ mode: m });
    const s = this.state || {};
    const vmode = s.v || 'week';
    const set = (o) => this.setState(o);
    const segBtn = (on) => 'border:0;height:28px;padding:0 12px;border-radius:6px;font:600 12px Public Sans,sans-serif;cursor:pointer;' + (on ? 'background:#15263b;color:#fff' : 'background:none;color:#667180');
    const vw = [['day', 'Day'], ['week', 'Week']].map(([k, l]) => ({ l, pressed: k === vmode ? 'true' : 'false', st: segBtn(k === vmode), pick: () => set({ v: k }) }));
    // [day 0-4, start, end, title, client line, colour, include, warning]
    const SG = [
      [0, 9, 11, 'KYC Review & DSC', 'Orchid Lane · due Mon 19 ', '#4f46e5', 1],
      [0, 14, 15.5, 'GST Registration · ARN follow-up', 'Kestrel · span 14-20', '#0284c7', 1],
      [1, 9, 11, 'TDS challan · Sep', 'Kestrel · filing 20 Oct', '#0284c7', 1],
      [1, 14, 17, 'GSTR-1 working', 'Halcyon · filing 20 Oct', '#a35f00', 1],
      [2, 9, 11.5, 'Draft Board resolution', 'Larkspur · due Wed 21 ', '#16a34a', 1],
      [3, 10, 11, 'FC-GPR resubmission', 'Tidewater', '#0d9488', 1],
      [3, 14, 15.5, 'Monthly GST recon ↻', 'Halcyon · moved from Tue', '#a16207', 1],
      [4, 16, 17, 'Bank KYC pack', 'Brightwave · span ended 16 Oct', '#db2777', 0, 'Outside span']
    ];
    const H0 = 9, NH = 9, PX = 50;
    const hl = (h) => (h > 12 ? h - 12 : h) + (h >= 12 ? ' PM' : ' AM');
    const fmt = (h) => { const hh = Math.floor(h); return (hh > 12 ? hh - 12 : hh) + ':' + (h % 1 ? '30' : '00'); };
    const hours = []; for (let i = 0; i < NH; i++) hours.push({ l: hl(H0 + i),
      st: 'position:absolute;right:8px;top:' + (i * PX - 7) + 'px;font:600 12px Public Sans,sans-serif;color:#3c4a5e;white-space:nowrap',
      line: 'position:absolute;left:0;right:0;top:' + (i * PX) + 'px;border-top:1px solid #e3e8ef' });
    const DN = ['MON 19', 'TUE 20', 'WED 21', 'THU 22', 'FRI 23'];
    const dayIdx = vmode === 'day' ? [1] : [0, 1, 2, 3, 4];
    const days = dayIdx.map(i => {
      const ev = SG.filter(e => e[0] === i);
      const load = ev.filter(e => e[6]).reduce((t, e) => t + e[2] - e[1], 0);
      return { l: DN[i], load: load + ' h',
        ls: 'display:block;font:600 10px IBM Plex Mono,monospace;margin-top:2px;' + (load > 6 ? 'color:#be3434' : 'color:#98a1ae'),
        hs: 'display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font:600 11.5px IBM Plex Mono,monospace;letter-spacing:.04em;border-left:1px solid #eef0f3;border-bottom:1px solid #e3e6eb;color:' + (load > 6 ? '#be3434' : '#15263b'),
        body: 'position:relative;height:' + (NH * PX) + 'px;border-left:1px solid #e3e8ef',
        ev: ev.map(([d, a, b, t, c, col, on, warnT]) => ({ t, c, time: fmt(a), range: fmt(a) + ' to ' + fmt(b) + (b >= 12 ? 'pm' : 'am'), cs: 'display:block;font-size:11px;margin-top:3px;' + (on ? 'color:rgba(255,255,255,.85)' : 'color:#667180'), warn: !!warnT, warnT: warnT || '', tip: t + ' · ' + fmt(a) + '–' + fmt(b),
          st: 'position:absolute;left:4px;right:6px;top:' + ((a - H0) * PX + 1) + 'px;height:' + ((b - a) * PX - 3) + 'px;border-radius:8px;padding:5px 8px;overflow:hidden;font-family:Public Sans,sans-serif;' + (on ? 'background:' + col + ';color:#fff;box-shadow:0 1px 3px rgba(15,42,74,.25)' : 'background:#fff;color:#667180;border:1.5px dashed ' + col + ';opacity:.8') })) };
    });
    const tmpl = '56px repeat(' + dayIdx.length + ',minmax(' + (vmode === 'day' ? 420 : 128) + 'px,1fr))';
    return { mode: __m, setMode: __set, vw, days, hours, range: vmode === 'day' ? 'TUE 20 OCT · 6.5 H' : '19 to 23 OCT · 14.5 H', nOn: SG.filter(e => e[6]).length,
      gridMin: 'min-width:' + (vmode === 'day' ? 480 : 700) + 'px',
      cols: 'display:grid;grid-template-columns:' + tmpl,
      hourCol: 'position:relative;height:' + (NH * PX) + 'px' };
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
