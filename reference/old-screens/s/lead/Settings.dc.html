<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lead · Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563a8;text-decoration:none}
.L{font-family:Public Sans,system-ui,sans-serif;color:#15263b;font-size:13px;background:#f7f9fc}
.L *{box-sizing:border-box}
.card{background:#fff;border:1px solid #e3e6eb;border-radius:10px;box-shadow:0 1px 2px rgba(15,42,74,.04),0 6px 18px -10px rgba(15,42,74,.18);min-width:0;padding:18px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
/* aligned columns: chips and row buttons share one width so they line up */
td .chip,.row>.chip,.td>.chip,.sr .chip,.ql .chip{min-width:84px;justify-content:center;box-sizing:border-box}
.row>.btn,td .btn,.td>.btn{min-width:84px;justify-content:center;box-sizing:border-box}
.sg{font-family:sans-serif;letter-spacing:-.03em}
.mut{color:#667180}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;font:600 12.5px Public Sans,sans-serif;border:1px solid #d0d5dd;background:#fff;color:#15263b;cursor:pointer;white-space:nowrap}
.btnp{background:#15263b;border-color:#15263b;color:#fff}
.h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.h b{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.tile{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.f label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.f input{width:100%;height:36px;border:1px solid #d0d5dd;border-radius:6px;padding:0 10px;font:inherit;font-size:13px;color:#15263b}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;align-items:start}
.sw{display:inline-flex;width:38px;height:22px;border-radius:99px;padding:2px;flex:none}
.sw i{width:18px;height:18px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh">
  <div style="flex: 1 1 248px; max-width: 248px; background: #15263b"><dc-import name="Side" active="settings" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Today › Settings" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px clamp(12px, 2vw, 28px) 60px; display: flex; flex-direction: column; gap: 16px">
      <div class="cols">
        <section class="card f">
          <div class="h"><span class="tile" style="background: #e3edfb; color: #2563a8"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><b>Profile</b></div>
          <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px"><span style="width: 64px; height: 64px; border-radius: 12px; background: #eef0f3; color: #15263b; display: grid; place-items: center; font-size: 20px; font-weight: 800">BH</span><span style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="btn">Upload photo</button><button type="button" class="btn">Use Outlook photo</button><button type="button" class="btn" style="color: #be3434">Remove</button></span></div>
          <div class="g2">
            <div><label for="fn">Full name</label><input id="fn" value="Bharath"></div>
            <div><label for="em">Email</label><input id="em" value="bharath@sbc.example" disabled style="background: #f7f9fc"></div>
            <div><label for="ph">Phone</label><input id="ph" value="+91 98450 12345"></div>
            <div><label for="rl">Role</label><input id="rl" value="Project lead" disabled style="background: #f7f9fc"></div>
          </div>
          <label style="display: flex !important; align-items: center; gap: 10px; margin: 14px 0; padding: 10px 12px; border: 1px solid #bfe5d4; background: #f3fbf7; border-radius: 8px; font-weight: 600"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #1e7f55">WhatsApp reminders on +91 98450 12345<span class="mut" style="font-weight: 500; margin-left: auto; font-size: 11.5px">Email stays the record</span></label>
          <button type="button" class="btn btnp">Save profile</button>
        </section>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <section class="card f">
            <div class="h"><span class="tile" style="background: #fbe6e6; color: #be3434"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span><b>Security</b></div>
            <div style="display: flex; flex-direction: column; gap: 10px"><div><label for="p0">Current password</label><input id="p0" type="password" value="••••••••"></div><div class="g2"><div><label for="p1">New password</label><input id="p1" type="password"></div><div><label for="p2">Confirm password</label><input id="p2" type="password"></div></div></div>
            <button type="button" class="btn" style="margin-top: 12px">Update password</button>
          </section>
          <section class="card">
            <div class="h"><span class="tile" style="background: #e3edfb; color: #2563a8"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span><b>Outlook</b><span class="chip" style="background: #e2f3ea; color: #1e7f55; margin-left: auto"><i style="width: 7px; height: 7px; border-radius: 99px; background: #1e7f55"></i>Connected</span></div>
            <div style="display: flex; align-items: center; gap: 10px"><span class="mut">Mailbox</span><b>bharath@sbc.example</b><button type="button" class="btn" style="margin-left: auto">Disconnect</button></div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const __m = (this.state && this.state.mode) || 'mixed';
    const __set = (m) => this.setState({ mode: m });
    const looks = [['Solid', '#15263b'], ['Gradient', 'linear-gradient(115deg,#15263b,#2563a8)', 1], ['Images', '#2b4766'], ['Upload', '#f1f4f8']].map(([n, bg, on]) => ({ n,
      sw: 'display:block;width:96px;height:44px;border-radius:6px;background:' + bg + (bg === '#f1f4f8' ? ';border:1.5px dashed #c3ccd8' : ''),
      st: 'display:flex;flex-direction:column;gap:5px;align-items:center;padding:6px;border-radius:8px;font:600 11.5px Public Sans,sans-serif;color:#15263b;cursor:pointer;background:#fff;border:' + (on ? '2px solid #15263b' : '1px solid #e3e6eb') }));
    return { mode: __m, setMode: __set,  looks };
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
