<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin top bar</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
<script src="./assign.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.lp-crumb{cursor:pointer;text-decoration:none;border-radius:6px}.lp-crumb:hover{color:#2563a8!important;text-decoration:underline}</style>
</helmet>
<header style="min-height: 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px clamp(12px, 2vw, 28px); background: rgba(255,255,255,.94); border-bottom: 1px solid #e3e6eb; font-family: Public Sans, system-ui, sans-serif; font-size: 13px; color: #15263b">
  <button type="button" aria-label="Back" title="Back to the previous screen" style="width: 32px; height: 32px; flex: none; border-radius: 8px; border: 1px solid #e3e6eb; background: #fff; color: #15263b; display: grid; place-items: center; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
  <a href="#" aria-label="SBC home" style="display: flex; flex: none"><img src="vcfo-bin:b/58380a4992a06cfe5c18a947b721abdf.png" alt="SBC" style="height: 24px; width: auto"></a>
  <nav aria-label="Location" style="flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden">
    <span style="color: #c3ccd8">/</span>
    <sc-for list="{{trail}}" as="t" hint-placeholder-count="2"><sc-if value="{{t.sep}}" hint-placeholder-val="{{true}}"><a href="#" data-crumb="1" class="lp-crumb" style="{{t.st}}">{{t.label}}</a></sc-if><sc-if value="{{t.last}}" hint-placeholder-val="{{false}}"><span style="{{t.st}}">{{t.label}}</span></sc-if><sc-if value="{{t.sep}}" hint-placeholder-val="{{false}}"><span style="color: #c3ccd8">›</span></sc-if></sc-for>
  </nav>
  <div role="group" aria-label="Preview state" style="display: inline-flex; align-items: center; gap: 8px; flex: none">
    <span style="font: 600 10px 'IBM Plex Mono', monospace; letter-spacing: .08em; color: #98a1ae">PREVIEW</span>
    <span style="display: inline-flex; padding: 2px; border-radius: 8px; background: #f1f4f8; box-shadow: inset 0 0 0 1px #e3e6eb">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.st}}">{{m.label}}</button></sc-for>
    </span>
  </div>
  <div style="display: flex; align-items: center; gap: 4px; flex: none">
    <button type="button" aria-label="Search (Ctrl K)" style="display: flex; align-items: center; gap: 8px; width: 220px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #e3e6eb; background: #f8fafc; color: #667180; font: 500 13px Public Sans, sans-serif; cursor: text">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563a8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <span style="flex: 1; text-align: left">Search</span><span style="font: 500 11px 'IBM Plex Mono', monospace; border-radius:6px; padding: 1px 5px; box-shadow: inset 0 0 0 1px #e3e6eb">Ctrl K</span>
    </button>
    <button type="button" aria-label="Announcements, 2 new" title="Announcements" style="position: relative; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: #667180; display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg>
      <span style="position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; border-radius: 99px; background: #15263b; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff">2</span>
    </button>
    
    <button type="button" aria-label="Switch to dark theme" title="Theme" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #e3e6eb; background: #fff; color: #667180; display: grid; place-items: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path></svg>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumb":{"editor":"text","default":"Today"},"mode":{"editor":"enum","options":["before","mixed","after"],"default":"mixed"},"onMode":{"editor":null},"$preview":{"width":1192,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'mixed';
    const parts = String(this.props.crumb ?? 'Today').split(' › ');
    const trail = parts.map((label, i) => ({ label, sep: i < parts.length - 1, last: i === parts.length - 1,
      st: i === parts.length - 1 ? 'font-weight:700;color:#15263b;overflow:hidden;text-overflow:ellipsis' : 'color:#667180' }));
    const modes = [['before', 'All incorporating'], ['mixed', 'Mixed'], ['after', 'All compliance']].map(([k, label]) => ({
      label, pressed: k === mode ? 'true' : 'false',
      pick: () => { if (this.props.onMode) this.props.onMode(k); },
      st: 'border:0;height:28px;padding:0 10px;border-radius:6px;font:600 12px Public Sans,sans-serif;cursor:pointer;' + (k === mode ? 'background:#15263b;color:#fff;box-shadow:0 1px 2px rgba(15,42,74,.25)' : 'background:none;color:#667180')
    }));
    return { trail, modes };
  }
}
</script>
</body>
</html>
