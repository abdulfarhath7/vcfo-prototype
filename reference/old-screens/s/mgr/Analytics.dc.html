<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager · Analytics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.L{font-family:Public Sans,system-ui,sans-serif;color:#15263b;font-size:13px;background:#f7f9fc;font-variant-numeric:tabular-nums}
.L *{box-sizing:border-box}
.card{background:#fff;border:1px solid #e3e6eb;border-radius:10px;box-shadow:0 1px 2px rgba(15,42,74,.04),0 6px 18px -10px rgba(15,42,74,.18);min-width:0;position:relative}
.chip{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
/* aligned columns: chips and row buttons share one width so they line up */
td .chip,.row>.chip,.td>.chip,.sr .chip,.ql .chip{min-width:84px;justify-content:center;box-sizing:border-box}
.row>.btn,td .btn,.td>.btn{min-width:84px;justify-content:center;box-sizing:border-box}
.sg{font-family:sans-serif;letter-spacing:-.03em}
.mono{font-family:'IBM Plex Mono',monospace}
.mut{color:#667180}
.tile{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ch2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh">
  <div style="flex: 1 1 248px; max-width: 248px; background: #15263b"><dc-import name="Side" active="analytics" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Today › Analytics" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 20px clamp(12px, 2vw, 28px) 60px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
        <span style="display: inline-flex; padding: 2px; border-radius: 8px; background: #f1f4f8; box-shadow: inset 0 0 0 1px #e3e6eb"><span style="height: 28px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; background: #15263b; color: #fff">Last 6 months</span><span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; color: #667180">Last 12 months</span></span>
      </div>
      <div class="kp">
        <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
          <div class="card" style="padding: 14px 16px; display: flex; gap: 12px; align-items: center">
            <span class="tile" style="{{k.ts}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.p}}"></path></svg></span>
            <span style="flex: 1"><span class="mut" style="display: block; font-size: 12px; font-weight: 600">{{k.l}}</span><b class="sg" style="font-size: 26px; line-height: 1.1">{{k.n}}</b></span>
            <span style="{{k.ds}}">{{k.d}}</span>
          </div>
        </sc-for>
      </div>
      <div class="ch2">
        <section class="card" style="padding: 14px 16px">
          <div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 12px; letter-spacing: .07em; text-transform: uppercase">Compliance completion rate</b><span class="chip" style="background: #eef0f3; color: #667180">Sample data</span><span class="mut" style="margin-left: auto; font-size: 11.5px">Monthly actuals vs 95% target</span></div>
          <div style="position: relative; height: 240px; margin-top: 16px; display: flex; align-items: flex-end; gap: 18px; padding: 0 8px 22px 30px; border-bottom: 1px solid #e3e6eb">
            <span style="position: absolute; left: 30px; right: 0; bottom: 208px; border-top: 2px dashed #e9792f"></span>
            <span class="mono" style="position: absolute; right: 0; bottom: 212px; font-size: 10px; color: #a35f00">95% target</span>
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="6"><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative" title="{{b.tip}}"><span class="mono" style="font-size: 10.5px; font-weight: 600">{{b.v}}</span><span style="{{b.st}}"></span><span class="mono mut" style="position: absolute; bottom: -20px; font-size: 10.5px">{{b.m}}</span></div></sc-for>
          </div>
        </section>
        <section class="card" style="padding: 14px 16px">
          <div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 12px; letter-spacing: .07em; text-transform: uppercase">Average filing delay</b><span class="chip" style="background: #eef0f3; color: #667180">Sample data</span><span class="mut" style="margin-left: auto; font-size: 11.5px">Days past statutory due date · benchmark 2d</span></div>
          <svg viewBox="0 0 480 250" width="100%" height="250" role="img" aria-label="Average filing delay fell from 4.2 to 1.3 days" style="margin-top: 10px; display: block">
            <line x1="30" y1="220" x2="470" y2="220" stroke="#e3e6eb"></line>
            <line x1="30" y1="148" x2="470" y2="148" stroke="#e9792f" stroke-width="2" stroke-dasharray="6 5"></line>
            <text x="470" y="140" text-anchor="end" font-family="IBM Plex Mono" font-size="10" fill="#a35f00">2d benchmark</text>
            <polyline points="60,69 140,98 220,112 300,141 380,163 450,173" fill="none" stroke="#2563a8" stroke-width="3" stroke-linejoin="round"></polyline>
            <g fill="#fff" stroke="#2563a8" stroke-width="2.5"><circle cx="60" cy="69" r="5"></circle><circle cx="140" cy="98" r="5"></circle><circle cx="220" cy="112" r="5"></circle><circle cx="300" cy="141" r="5"></circle><circle cx="380" cy="163" r="5"></circle><circle cx="450" cy="173" r="5"></circle></g>
            <g font-family="IBM Plex Mono" font-size="10.5" fill="#667180" text-anchor="middle"><text x="60" y="240">MAY</text><text x="140" y="240">JUN</text><text x="220" y="240">JUL</text><text x="300" y="240">AUG</text><text x="380" y="240">SEP</text><text x="450" y="240">OCT</text></g>
            <g font-family="IBM Plex Mono" font-size="10.5" fill="#15263b" font-weight="600" text-anchor="middle"><text x="60" y="56">4.2</text><text x="140" y="85">3.4</text><text x="220" y="99">3.0</text><text x="300" y="128">2.2</text><text x="380" y="150">1.6</text><text x="450" y="160">1.3</text></g>
          </svg>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const __m = (this.state && this.state.mode) || 'mixed';
    const __set = (m) => this.setState({ mode: m });
    const kpis = [
      ['Projects', '8', '+1', 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z M10 6h4 M10 10h4 M10 14h4', 'background:#e3edfb;color:#2563a8', 'ok'],
      ['Steps completed', '126', '+18', 'M20 6 9 17l-5-5', 'background:#e2f3ea;color:#1e7f55', 'ok'],
      ['Waiting on client', '6', '+2', 'M12 6v6l4 2 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z', 'background:#e3edfb;color:#2563a8', 'bad'],
      ['Overdue steps', '3', '−1', 'M12 8v4 M12 16h.01 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z', 'background:#fbe6e6;color:#be3434', 'ok']
    ].map(([l, n, d, p, ts, good]) => ({ l, n, d, p, ts, ds: 'font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 6px;' + (good === 'ok' ? 'background:#e2f3ea;color:#1e7f55' : 'background:#fdf0e3;color:#8a4a10') }));
    const bars = [['MAY', 88], ['JUN', 91], ['JUL', 93], ['AUG', 90], ['SEP', 96], ['OCT', 97]].map(([m, v]) => ({ m, v: v + '%', tip: m + ' · ' + v + '% on time',
      st: 'display:block;width:100%;max-width:46px;border-radius:4px 4px 0 0;height:' + Math.round(v * .9 * 218 / 100) + 'px;background:' + (v >= 95 ? '#1e7f55' : '#2563a8') }));
    return { mode: __m, setMode: __set,  kpis, bars };
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
