<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.lp-out:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}.lp-out:focus-visible{outline:2px solid #fff;outline-offset:2px}</style>
</helmet>
<aside style="width: 100%; min-height: 1000px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #15263b; color: #fff; font-family: Public Sans, system-ui, sans-serif; font-size: 13px">
  <a href="#" aria-label="VCFO Suite home" style="height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.08); flex: none"><img src="vcfo-bin:brand/vcfo-logo-on-black.png" alt="VCFO Suite" style="height: 26px; width: auto"></a>
  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px; padding: 12px 8px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column">
        <div style="position: relative">
        <a href="#" aria-current="{{n.cur}}" style="{{n.st}}">
          <span style="{{n.ic}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
          <span style="flex: 1">{{n.label}}</span>
          <sc-if value="{{n.hasNew}}" hint-placeholder-val="{{false}}"><span style="font: 600 10px Public Sans, sans-serif; color: #e9eff6; background: rgba(255,255,255,.12); border-radius: 6px; padding: 1px 6px">New</span></sc-if>
          <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{n.bs}}">{{n.badge}}</span></sc-if>
        </a>
        <sc-if value="{{n.canFold}}" hint-placeholder-val="{{false}}"><button type="button" class="ds-fold" data-nav-fold="{{n.foldKey}}" aria-expanded="{{n.openStr}}" aria-label="{{n.foldLabel}}" title="{{n.foldLabel}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></sc-if>
        </div>
        <sc-if value="{{n.hasSubs}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; padding: 0 0 4px 37px">
            <sc-for list="{{n.subs}}" as="sb" hint-placeholder-count="2"><a href="#" style="{{sb.st}}">{{sb.label}}</a></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{n.isLeads}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 18px">
            <sc-for list="{{leads}}" as="l" hint-placeholder-count="3">
              <a href="#" title="{{l.tip}}" aria-label="{{l.tip}}" aria-current="{{l.cur}}" style="{{l.st}}">
                <span style="{{l.av}}">{{l.ini}}</span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</span><span style="{{l.ps}}">{{l.open}}</span>
              </a>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{n.isClients}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 18px">
            <sc-for list="{{clients}}" as="c" hint-placeholder-count="4">
              <a href="#" title="{{c.tip}}" aria-label="{{c.name}}" aria-current="{{c.cur}}" style="{{c.st}}">
                <span style="{{c.dot}}"></span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span><span style="{{c.ps}}">{{c.phase}}</span>
              </a>
            </sc-for>
            <a href="#" style="height: 26px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; color: #e9eff6">View all 8</a>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </nav>
  <div style="margin-top: auto; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <a href="#" title="Open compliance calendar" style="display: block; border-top: 1px solid rgba(255,255,255,.1); padding-top: 10px; color: #fff">
      <div style="display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; margin-bottom: 4px"><span>October 2026</span><span style="color: #8fa2bb; font-weight: 500">Due days</span></div>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; font: 500 10px Public Sans, sans-serif; text-align: center; color: #8fa2bb">
        <sc-for list="{{cal}}" as="d" hint-placeholder-count="35"><span style="{{d.st}}">{{d.n}}</span></sc-for>
      </div>
    </a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0 0; border-top: 1px solid rgba(255,255,255,.1); color: #fff; cursor: pointer" data-go="lead-profile" title="Your profile">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none">PN</span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 600">Pranay</span><span style="display: block; font-size: 11px; color: #9fb0c6">Manager</span></span>
      <button type="button" class="lp-out" data-signout aria-label="Sign out" title="Sign out" style="flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius:8px; background: none; color: #a9b6c9; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4.5H6A1.5 1.5 0 0 0 4.5 6v12A1.5 1.5 0 0 0 6 19.5h4"></path><path d="M14 8l4 4-4 4"></path><path d="M18 12H8.5"></path></svg></button>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","work","clients","leads","email","docs","updates","compliances","analytics","audit","settings"],"default":"today"},"mode":{"editor":"enum","options":["before","mixed","after"],"default":"mixed"},"sub":{"editor":"text","default":""},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    if (!this.__nvl) { this.__nvl = 1; window.addEventListener('vcfo:nav', () => this.setState({ navTick: Date.now() })); }
    if (!this.__ldl) { this.__ldl = 1; window.addEventListener('vcfo:lead', () => this.setState({ ldTick: Date.now() })); }
    const mode = this.props.mode ?? 'mixed';
    const P = {
      registrations: 'M9 12l2 2 4-4 M12 2.5l2.3 1.7 2.9-.2.9 2.8 2.4 1.6-.9 2.7.9 2.7-2.4 1.6-.9 2.8-2.9-.2L12 21.5l-2.3-1.7-2.9.2-.9-2.8-2.4-1.6.9-2.7-.9-2.7 2.4-1.6.9-2.8 2.9.2Z',
      today: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
      work: 'm3 17 2 2 4-4 M3 7l2 2 4-4 M13 6h8 M13 12h8 M13 18h8',
      clients: 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2 M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2 M10 6h4 M10 10h4 M10 14h4 M10 18h4',
      email: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z m18 3-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7',
      docs: 'M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z',
      updates: 'm3 11 18-5v12L3 14v-3z M11.6 16.8a3 3 0 1 1-5.8-1.6',
      compliances: 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M16 2v4 M8 2v4 M3 10h18 M9 16l2 2 4-4',
      analytics: 'M3 3v18h18 M18 17V9 M13 17V5 M8 17v-3',
      leads: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
      audit: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5 M12 7v5l4 2',
      settings: 'M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'
    };
    const items = [['today', 'Today'], ['work', 'Work', '9', 'r'], ['leads', 'Project leads', '3', 'g'], ['clients', 'Clients', '8', 'g']];
    if (mode !== 'before') items.push(['compliances', 'Compliances', mode === 'after' ? '8' : '4', 'g', true]);
    items.push(['registrations', 'Registrations'], ['updates', 'Updates', '2', 'r'], ['email', 'Email'], ['docs', 'Docs'], ['analytics', 'Analytics'], ['audit', 'Audit']);
    const SUB = { docs: ['Vault', 'Knowledge bank'], updates: ['Announcements', 'Notifications'], compliances: ['Calendar', 'Filings', 'Obligations'] };
    let ldSel = ''; if (active === 'leads') { try { ldSel = sessionStorage.getItem('vcfo.lead') || ''; } catch (e) {} ldSel = ldSel || 'Bharath'; }
    const curCl = this.props.client ?? '';
    const sub = ((this.props.sub ?? '') || ldSel) || (active === 'clients' ? curCl : '');
    const nav = items.map(([k, label, badge, bk, isNew]) => {
      const on = k === active;
      const subs = (SUB[k] || []).map(l => ({ label: l, st: 'display:flex;align-items:center;height:26px;padding:0 8px;border-radius:6px;font-size:12.5px;' + (on && l === sub ? 'color:#fff;font-weight:600;background:#2b4766;box-shadow:inset 3px 0 0 #e9792f' : 'color:#9fb0c6') }));
      return { subs, hasSubs: subs.length > 0,
        label, d: P[k], cur: on ? 'page' : 'false', hasBadge: !!badge, badge: badge || '', hasNew: !!isNew, isClients: k === 'clients', isLeads: k === 'leads',
        st: 'position:relative;display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;' + (on && !sub ? 'background:#2b4766;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #e9792f' : (on ? 'color:#fff;font-weight:600' : 'color:#b8c4d4;font-weight:500')),
        ic: 'display:flex;',
        bs: 'min-width:20px;height:18px;padding:0 5px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;' + 'background:rgba(255,255,255,.12);color:#fff'
      };
    });
    let fold = { clients: true, leads: true };
    try { fold = { clients: sessionStorage.getItem('vcfo.nav.clients') !== '0', leads: sessionStorage.getItem('vcfo.nav.leads') !== '0' }; } catch (e) {}
    nav.forEach((n, i) => {
      const k = items[i][0]; n.canFold = k === 'clients' || k === 'leads'; if (!n.canFold) return;
      n.foldKey = k; n.openStr = fold[k] ? 'true' : 'false'; n.foldLabel = (fold[k] ? 'Hide ' : 'Show ') + (k === 'leads' ? 'leads' : 'clients');
      n.st += ';padding-right:36px'; n.isClients = n.isClients && fold[k]; n.isLeads = n.isLeads && fold[k];
    });
    const C = [
      ['Northwind Technologies', '#7c3aed', 'inc', 'Incorporating · Pre-7'],
      ['Orchid Lane Foods', '#4f46e5', 'inc', 'Incorporating · Pre-10'],
      ['Brightwave Robotics', '#db2777', 'cmp', 'Compliance · Post-3'],
      ['Kestrel Health', '#0284c7', 'cmp', 'Compliance · Reg-1']
    ];
    const ALLC = { 'Tidewater Logistics': ['#0d9488', 'cmp', 'Compliance · Post-8'], 'Halcyon Fintech': ['#a16207', 'cmp', 'Compliance · Filing'], 'Larkspur Analytics': ['#16a34a', 'inc', 'Incorporating · Pre-2'], 'Juniper Bio': ['#64748b', 'inc', 'Incorporating · Pre-1'] };
    if (curCl && !C.some(c => c[0] === curCl) && ALLC[curCl]) C.push([curCl].concat(ALLC[curCl]));
    const clients = C.map(([name, col, ph, tip]) => {
      const p = mode === 'before' ? 'inc' : (mode === 'after' ? 'cmp' : ph);
      return { name, tip, phase: p === 'inc' ? 'Inc' : 'Cmp', cur: name === curCl ? 'page' : 'false',
        st: 'display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;font-size:12.5px;' + (name === curCl ? 'color:#fff;font-weight:600;background:#2b4766;box-shadow:inset 3px 0 0 #e9792f' : 'color:#c9d6e8'),
        dot: 'width:8px;height:8px;border-radius:2px;flex:none;background:' + col,
        ps: "font:600 10px Public Sans,sans-serif;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.1);color:#c9d6e8" };
    });
    const leads = [['Bharath', 'BH', '', 13], ['Sneha Kulkarni', 'SK', '', 13], ['Meera Nair', 'MN', '', 8]].map(([name, ini, c, open]) => ({
      name, ini, open: open + ' open', tip: name + ' · ' + open + ' open tasks', cur: ldSel === name.split(' ')[0] ? 'page' : 'false',
      st: 'display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;font-size:12.5px;' + (ldSel === name.split(' ')[0] ? 'color:#fff;font-weight:600;background:#2b4766;box-shadow:inset 3px 0 0 #e9792f' : 'color:#c9d6e8'),
      av: 'width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff;background:rgba(255,255,255,.12)',
      ps: "font:600 10px Public Sans,sans-serif;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.1);color:#c9d6e8" }));
    const mgrs = [['Krishna', 'KR', 'Admin', '']].map(([name, ini, role, c]) => ({
      name, ini, role, mail: 'Email ' + name,
      av: 'width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.12)' }));
    const due = { 7: '#1e7f55', 11: '#1e7f55', 15: '#be3434', 20: '#a35f00', 22: '#15263b', 25: '#15263b', 31: '#15263b' };
    const cal = [];
    for (let i = 0; i < 3; i++) cal.push({ n: '', st: '' });
    for (let d = 1; d <= 31; d++) {
      const c = mode === 'before' ? null : due[d];
      cal.push({ n: d, st: 'height:17px;display:grid;place-items:center;border-radius:3px;' + (d === 16 ? 'background:#2b4766;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px #6fa3e0' : (c ? 'color:#fff;box-shadow:inset 0 -2px 0 ' + (c === '#15263b' ? '#9ec5ff' : c) : '')) });
    }
    return { nav, clients, leads, mgrs, cal };
  }
}
</script>
</body>
</html>
