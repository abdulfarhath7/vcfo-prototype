<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager · Registrations</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
<script src="./regcat.js"></script>
</head>
<body>
<x-dc>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh; position: relative; background: #f5f6f8">
  <div style="flex: 1 1 248px; max-width: 248px; background: #15263b"><dc-import name="Side" active="registrations" sub="" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Today › Registrations" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1400px; width: 100%; margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px) 110px; box-sizing: border-box">
      <dc-import name="Register" kind="reg" who="staff" hint-size="100%,1200px" style="display: block; width: 100%"></dc-import>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() { const s = this.state || {}; return { mode: s.mode || 'mixed', setMode: (m) => this.setState({ mode: m }) }; }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
